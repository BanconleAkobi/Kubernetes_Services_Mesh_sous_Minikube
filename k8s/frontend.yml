apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: labotrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: labotrack/frontend:1.0
          ports:
            - containerPort: 80
          env:
            - name: SERVICE1_URL
              value: http://service1:9000
            - name: SERVICE3_URL
              value: http://service3:9002
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: labotrack
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
