apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: service3-data
  namespace: labotrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service3
  namespace: labotrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service3
  template:
    metadata:
      labels:
        app: service3
    spec:
      containers:
        - name: service3
          image: labotrack/service3:1.0
          ports:
            - containerPort: 9002
          volumeMounts:
            - name: h2-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9002
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: h2-data
          persistentVolumeClaim:
            claimName: service3-data
---
apiVersion: v1
kind: Service
metadata:
  name: service3
  namespace: labotrack
spec:
  selector:
    app: service3
  ports:
    - port: 9002
      targetPort: 9002
