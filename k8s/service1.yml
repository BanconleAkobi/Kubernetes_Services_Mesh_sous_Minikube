apiVersion: apps/v1
kind: Deployment
metadata:
  name: service1
  namespace: labotrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service1
  template:
    metadata:
      labels:
        app: service1
    spec:
      containers:
        - name: service1
          image: labotrack/service1:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service1
  namespace: labotrack
spec:
  selector:
    app: service1
  ports:
    - port: 9000
      targetPort: 9000
